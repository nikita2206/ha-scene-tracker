services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: ha-scene-toggle-test
    volumes:
      # Mount custom components for development
      - ./custom_components:/config/custom_components:ro
      # Persistent config directory
      - ./test_config:/config
    ports:
      - "8123:8123"
    environment:
      - TZ=UTC
    restart: unless-stopped
