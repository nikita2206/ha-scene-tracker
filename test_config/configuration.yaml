# Minimal Home Assistant configuration for testing

homeassistant:
  name: Test Home
  unit_system: metric
  time_zone: UTC

# Enable the default frontend
frontend:

# Enable the HTTP API
http:

# Scenes (file is gitignored, created automatically if missing)
scene: !include scenes.yaml

# Template light for basic testing
light:
  - platform: template
    lights:
      test_light:
        friendly_name: "Test Light"
        value_template: "{{ states('input_boolean.test_light_state') }}"
        turn_on:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.test_light_state
        turn_off:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.test_light_state

# Input boolean to back the template light
input_boolean:
  test_light_state:
    name: "Test Light State"
    initial: false

# Demo platform provides lights with full color support (brightness, RGB, color_temp)
demo:

# Enable logging for debugging
logger:
  default: info
  logs:
    custom_components.scene_toggle: debug
